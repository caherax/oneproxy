name: Publish to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Build and check both platforms
        run: |
          # Check each executable before adding its image to the shared index.
          for arch in amd64 arm64; do
            variant="localhost/oneproxy-build:$arch"
            podman build --pull=always --platform "linux/$arch" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$variant" .
            podman run --rm --network none --platform "linux/$arch" \
              --entrypoint /usr/bin/warp-cli "$variant" --version
          done
          podman manifest create localhost/oneproxy-index \
            containers-storage:localhost/oneproxy-build:amd64 \
            containers-storage:localhost/oneproxy-build:arm64
          podman manifest inspect localhost/oneproxy-index | jq -e \
            '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]'

      - name: Push platform tags and latest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          podman push localhost/oneproxy-build:amd64 "docker://$IMAGE:latest-amd64"
          podman push localhost/oneproxy-build:arm64 "docker://$IMAGE:latest-arm64"
          podman manifest push --all localhost/oneproxy-index "docker://$IMAGE:latest"
